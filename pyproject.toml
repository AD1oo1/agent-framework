[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-framework"
version = "0.1.0"
description = "A modular AI agent framework built from first principles."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "elasticsearch>=9.5,<10",
    "google-genai>=2.27,<3",
    "openai>=3.13,<4",
    "pypdf>=6.19,<7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--import-mode=importlib -m 'not integration'"
markers = [
    "integration: tests that require external services or API credentials"
]

[tool.setuptools.packages.find]
where = ["src"]
